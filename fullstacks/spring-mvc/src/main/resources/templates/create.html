<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="dark">
<head th:replace="~{fragments/layout :: head('写给未来的信')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="cy-container cy-container--narrow" style="margin-top:var(--space-10);margin-bottom:var(--space-16)">
  <div style="max-width:720px;margin:0 auto">
    <h1 style="font-family:var(--font-display);font-size:var(--font-size-4xl);margin:0 0 var(--space-2)">写给未来的信</h1>
    <p style="color:var(--color-text-secondary);margin:0 0 var(--space-8)">
      这段文字会被上锁，直到你设定的时刻才能由任何人 —— 包括你自己 —— 开启。
    </p>

    <form id="create-form" class="cy-form" method="post" action="/create">
      <div class="cy-field">
        <label for="title">标题 <span style="color:var(--color-text-muted);font-weight:400">· 最多 60 字</span></label>
        <div style="display:flex;gap:var(--space-2);align-items:stretch">
          <input class="cy-input" id="title" name="title" type="text" maxlength="60" required
                 th:value="${title}" style="flex:1">
          <button type="button" class="cy-btn cy-btn--ghost" id="ai-generate"
                  title="让 AI 生成胶囊正文与建议开启时间；标题留空时会顺便起个标题"
                  style="white-space:nowrap">✨ AI 生成</button>
        </div>
      </div>

      <!-- AI 灵感推荐区：由 app.js 异步拉取后填充（空标题且有推荐时才显示） -->
      <div id="reco-area"></div>

      <div class="cy-field">
        <label for="content">内容 <span style="color:var(--color-text-muted);font-weight:400">· 最多 5000 字</span></label>
        <textarea class="cy-textarea" id="content" name="content" rows="10" maxlength="5000" required
                  th:text="${content}"
                  placeholder="在这里写下你想传递到未来的话。建议：&#10;- 具体的场景 / 情绪 / 正在读的书&#10;- 一个小小的许诺&#10;- 或只是一句：嘿，还活着吗？"></textarea>
      </div>

      <div class="cy-field">
        <label for="open_at">开启时间 <span style="color:var(--color-text-muted);font-weight:400">· 最早 60 秒后</span></label>
        <div class="cy-dtp" id="open_at_picker" data-dtp-input="open_at"></div>
        <input class="cy-input cy-dtp__source" id="open_at" type="datetime-local" required aria-hidden="true" tabindex="-1">
        <input type="hidden" id="openAt" name="openAt">
        <span class="cy-field__hint">时区以你当前所在时区为准，提交时会转换为 UTC。</span>
        <div class="cy-create-presets">
          <span class="cy-create-presets__label">快速预设</span>
          <button type="button" class="cy-btn cy-btn--ghost cy-btn--sm" data-preset="1m">1 分钟后（测试）</button>
          <button type="button" class="cy-btn cy-btn--ghost cy-btn--sm" data-preset="1h">1 小时后</button>
          <button type="button" class="cy-btn cy-btn--ghost cy-btn--sm" data-preset="tomorrow9">明天早上 9:00</button>
          <button type="button" class="cy-btn cy-btn--ghost cy-btn--sm" data-preset="1y">1 年后</button>
          <button type="button" class="cy-btn cy-btn--ghost cy-btn--sm" data-preset="y2030">2030.01.01</button>
        </div>
      </div>

      <div class="cy-alert cy-alert--info">
        <span>ⓘ</span><span>上锁后不可编辑、不可提前开启；可以在"我创建的"列表里随时撤回（删除）。</span>
      </div>

      <div th:if="${error}" class="cy-alert cy-alert--danger">
        <span>⚠</span><span th:text="${error}">错误</span>
      </div>

      <div class="cy-create-actions">
        <label class="cy-toggle cy-toggle--inline">
          <input type="checkbox" name="inPlaza" value="true" th:checked="${inPlaza == null ? true : inPlaza}">
          <span class="cy-toggle__track"></span>
          <span class="cy-toggle__label">发布到胶囊广场</span>
        </label>
        <div class="cy-create-actions__buttons">
          <a class="cy-btn cy-btn--ghost" href="/me/created">取消</a>
          <button class="cy-btn cy-btn--primary cy-btn--lg" type="submit">🔒 上锁封存</button>
        </div>
      </div>
    </form>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
