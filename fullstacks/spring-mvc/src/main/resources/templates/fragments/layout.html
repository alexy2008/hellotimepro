<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="dark">
<!--
  布局 fragment：head / header / footer。各页面用 th:replace 引入。
  登录态由服务端模型属性 currentUser / authenticated 渲染（GlobalModelAttributes）。
-->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle != null ? pageTitle + ' · HelloTime Pro' : 'HelloTime Pro'}">HelloTime Pro</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
  <!-- 主题：在首帧前应用，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("hellotime.theme");
        if (t !== "dark" && t !== "light") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* noop */ }
    })();
  </script>
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>

<body>
<header th:fragment="header" class="cy-header">
  <div class="cy-container cy-header__inner">
    <a href="/" class="cy-brand">
      <img class="cy-brand__mark" src="/logo.svg" width="38" height="38" alt="">
      HelloTime<span class="cy-brand__pro">PRO</span>
    </a>
    <nav class="cy-nav">
      <a href="/">广场</a>
      <a href="/open">开启</a>
      <a href="/about">关于</a>
    </nav>
    <div class="cy-header__actions">
      <button type="button" class="cy-theme-toggle" aria-label="切换主题">
        <span aria-hidden="true">☾</span>
      </button>

      <div th:if="${authenticated}" class="cy-user-menu">
        <button type="button" class="cy-user-chip cy-user-chip--button"
                aria-haspopup="menu" aria-expanded="false"
                th:title="${currentUser.nickname}"
                th:attr="aria-label=${currentUser.nickname} + ' 的菜单'">
          <span th:text="${@fmt.shortName(currentUser.nickname)}">用户</span>
          <img th:src="${@fmt.avatarUrl(currentUser.avatarId)}" alt="">
          <span class="cy-user-chip__chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="cy-user-dropdown" role="menu" hidden>
          <a href="/me/created" role="menuitem" class="cy-user-dropdown__item">
            <span aria-hidden="true">📝</span><span>我创建的</span>
          </a>
          <a href="/me/favorites" role="menuitem" class="cy-user-dropdown__item">
            <span aria-hidden="true">♥</span><span>我收藏的</span>
          </a>
          <a href="/me/profile" role="menuitem" class="cy-user-dropdown__item">
            <span aria-hidden="true">⚙</span><span>账号设置</span>
          </a>
          <span class="cy-user-dropdown__divider"></span>
          <form id="logout-form" method="post" action="/logout" style="margin:0">
            <button type="submit" role="menuitem"
                    class="cy-user-dropdown__item cy-user-dropdown__item--danger">
              <span aria-hidden="true">↩</span><span>登出</span>
            </button>
          </form>
        </div>
      </div>

      <th:block th:unless="${authenticated}">
        <a href="/login" class="cy-btn cy-btn--ghost cy-btn--sm">登录</a>
        <a href="/register" class="cy-btn cy-btn--primary cy-btn--sm">注册</a>
      </th:block>
    </div>
  </div>
</header>

<!-- 个人中心侧边导航（我创建的 / 我收藏的 / 账号设置 / 登出）。 -->
<aside th:fragment="meNav(activeTab)" class="cy-me__nav">
  <a href="/me/created" th:classappend="${activeTab == 'created'} ? ' is-active' : ''">📝 我创建的</a>
  <a href="/me/favorites" th:classappend="${activeTab == 'favorites'} ? ' is-active' : ''">♥ 我收藏的</a>
  <a href="/me/profile" th:classappend="${activeTab == 'profile'} ? ' is-active' : ''">⚙ 账号设置</a>
  <span style="border-top:1px solid var(--color-border-subtle);margin:var(--space-3) 0"></span>
  <form method="post" action="/logout" style="margin:0">
    <button type="submit"
            style="background:none;border:0;color:var(--color-danger-fg);cursor:pointer;font:inherit;font-size:var(--font-size-sm);padding:var(--space-3);text-align:left;width:100%">
      登出
    </button>
  </form>
</aside>

<footer th:fragment="footer" class="cy-footer">
  <div class="cy-container cy-footer__inner">
    <div style="display:flex;align-items:center;gap:6px">
      © 2026 HelloTime Pro
      <span class="cy-backend-dot cy-backend-dot--online" title="服务端渲染"></span>
    </div>
    <div class="cy-stack">
      <span class="cy-stack__item" title="frontend">Thymeleaf</span>
      <span class="cy-stack__item" title="enhancement">HTMX</span>
      <span class="cy-stack__item" title="styling">
        <img src="/static/icons/tailwindcss.svg" alt="">Tailwind CSS
      </span>
      <span class="cy-stack__item" title="language">
        <img src="/static/icons/java.svg" alt="">Java
      </span>
      <span class="cy-stack__item" title="framework">
        <img src="/static/icons/springboot.svg" alt="">Spring Boot
      </span>
    </div>
  </div>
</footer>
</body>
</html>
