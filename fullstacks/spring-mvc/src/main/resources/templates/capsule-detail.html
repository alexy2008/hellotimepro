<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::content})}">
<body>
<th:block th:fragment="content">

  <div data-ht-detail-root
       th:attr="data-code=${capsule != null ? capsule.code() : code},
                data-is-opened=${capsule != null ? capsule.isOpened() : false},
                data-open-at=${capsule != null ? @fmt.iso(capsule.openAt()) : ''}">

    <!-- ============ 时笺详情页 ============ -->
    <div class="skin-slot" data-skin-view="paper">
      <div class="page page--detail">
        <div class="wrap wrap--narrow detail" data-ht-detail-paper
             th:attr="data-testid=${capsule != null ? 'capsule-detail' : null},
                      data-code=${capsule != null ? capsule.code() : null},
                      data-state=${capsule != null ? (capsule.isOpened() ? 'opened' : 'sealed') : null},
                      data-in-plaza=${capsule != null ? capsule.inPlaza() : null}">

          <div th:if="${missing}" class="lost" data-testid="detail-not-found">
            <div class="lost__mark">
              <th:block th:replace="~{fragments/parts :: seal(ch='无', variant='line', extraClass='')}" />
            </div>
            <h1 class="h1">查无此信</h1>
            <p>
              <th:block th:if="${code != null and !code.isEmpty()}">
                没有找到胶囊码为 <b class="mono" th:text="${code.toUpperCase()}"></b> 的胶囊。
              </th:block>
              <th:block th:if="${code == null or code.isEmpty()}">这枚胶囊不存在。</th:block>
              <br />它也可能已经被作者删除了。
            </p>
            <div class="lost__act">
              <a class="btn btn--primary" href="/open"><th:block th:utext="${@fmt.icon('key')}" />重新输入胶囊码</a>
              <a class="btn btn--ghost" href="/">回到广场</a>
            </div>
          </div>

          <th:block th:if="${capsule != null}">
            <th:block th:if="${capsule.isOpened()}">
              <th:block th:replace="~{fragments/capsule-detail :: paperOpened(c=${capsule}, reveal=${reveal})}" />
            </th:block>
            <th:block th:if="${!capsule.isOpened()}">
              <th:block th:replace="~{fragments/capsule-detail :: paperSealed(c=${capsule})}" />
            </th:block>
          </th:block>

        </div>
      </div>
    </div>

    <!-- ============ 琥珀详情页 ============ -->
    <div class="skin-slot" data-skin-view="amber">
      <div class="page page--detail">
        <div class="container detail" data-ht-detail-amber
             th:attr="data-testid=${capsule != null ? 'capsule-detail' : null},
                      data-code=${capsule != null ? capsule.code() : null},
                      data-state=${capsule != null ? (capsule.isOpened() ? 'opened' : 'sealed') : null},
                      data-in-plaza=${capsule != null ? capsule.inPlaza() : null}">

          <div th:if="${missing}" class="notice card" data-testid="detail-not-found">
            <th:block th:replace="~{fragments/parts :: capsuleArt(code='LOST0000', state='opened', width=200, extraClass='notice__art')}" />
            <div class="eyebrow">Not found</div>
            <h1 class="page-title">找不到这枚胶囊</h1>
            <p class="page-lead">
              <th:block th:if="${code != null and !code.isEmpty()}">
                没有胶囊码为 <b class="mono" th:text="${code.toUpperCase()}"></b> 的胶囊。
              </th:block>
              <th:block th:if="${code == null or code.isEmpty()}">这枚胶囊不存在。</th:block>
              也许是码抄错了一位，也许它已经被作者删除了。
            </p>
            <div class="notice__act">
              <a class="btn btn--primary" href="/open"><th:block th:utext="${@fmt.icon('key')}" />重新输入胶囊码</a>
              <a class="btn btn--ghost" href="/">回到广场</a>
            </div>
          </div>

          <th:block th:if="${capsule != null}">
            <div class="opening" hidden data-ht-amber-opening>
              <div class="opening__burst"></div>
              <div class="opening__capsule">
                <th:block th:replace="~{fragments/parts :: capsuleArt(code=${capsule.code()}, state='locked', width=300, extraClass='')}" />
              </div>
              <p class="opening__text">时间到了，正在开启……</p>
            </div>

            <div data-ht-amber-content>
              <th:block th:if="${capsule.isOpened()}">
                <th:block th:replace="~{fragments/capsule-detail :: amberLetter(c=${capsule}, reveal=${reveal})}" />
              </th:block>
              <th:block th:if="${!capsule.isOpened()}">
                <th:block th:replace="~{fragments/capsule-detail :: amberLocked(c=${capsule})}" />
              </th:block>
            </div>
          </th:block>

        </div>
      </div>
    </div>

  </div>

</th:block>
</body>
</html>
