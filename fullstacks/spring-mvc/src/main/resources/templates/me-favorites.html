<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="dark">
<head th:replace="~{fragments/layout :: head('我收藏的胶囊')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="cy-container">
  <div class="cy-me">
    <aside th:replace="~{fragments/layout :: meNav('favorites')}"></aside>
    <section class="cy-me__content">
      <h1>我收藏的胶囊</h1>
      <p style="color:var(--color-text-secondary);margin:0 0 var(--space-6)"
         th:text="'共 ' + ${pagination.total} + ' 条；取消收藏只会从此列表移除，不会影响原胶囊。'">共 0 条</p>

      <div th:if="${#lists.isEmpty(capsules)}" class="cy-empty">
        <div class="cy-empty__emoji">🗂</div>
        <p>还没有收藏任何胶囊 —— 去广场看看？</p>
        <a class="cy-btn cy-btn--ghost cy-btn--sm" href="/" style="margin-top:var(--space-3)">去广场</a>
      </div>
      <div th:unless="${#lists.isEmpty(capsules)}" class="cy-grid">
        <th:block th:each="cap : ${capsules}">
          <th:block th:replace="~{fragments/capsule :: card(capsule=${cap}, showCreator=true, hideFavorite=false)}"></th:block>
        </th:block>
      </div>
    </section>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
