<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="dark">
<head th:replace="~{fragments/layout :: head('开启胶囊')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="cy-container">
  <div class="cy-open-center">
    <h1>用 8 位密钥开启胶囊</h1>
    <p>输入朋友分享给你的 8 位大写字母和数字，可直接查看胶囊。</p>

    <div style="margin-bottom:var(--space-8)">
      <div class="cy-code-input">
        <input th:each="i : ${#numbers.sequence(1, 8)}" type="text" inputmode="text"
               autocapitalize="characters" maxlength="1"
               th:aria-label="'第 ' + ${i} + ' 位'">
      </div>
    </div>

    <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap">
      <button type="button" class="cy-btn cy-btn--primary cy-btn--lg" data-open-submit>开启 →</button>
    </div>

    <div style="margin-top:var(--space-10);color:var(--color-text-muted);font-size:var(--font-size-sm)">
      <div style="display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap">
        <span>💡 可用 <code style="background:var(--color-surface-2);padding:2px 6px;border-radius:var(--radius-sm)">/c/&lt;code&gt;</code> 直链访问</span>
        <span>🔒 未到开启时间的胶囊也会显示倒计时</span>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
