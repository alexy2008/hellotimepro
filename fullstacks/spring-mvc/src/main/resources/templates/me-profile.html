<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN" data-theme="dark">
<head th:replace="~{fragments/layout :: head('账号设置')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="cy-container">
  <div class="cy-me">
    <aside th:replace="~{fragments/layout :: meNav('profile')}"></aside>
    <section class="cy-me__content">
      <h1>账号设置</h1>

      <!-- 基本信息 -->
      <div class="cy-card" style="margin-bottom:var(--space-6)">
        <h2 style="font-size:var(--font-size-xl);margin:0 0 var(--space-5);font-family:var(--font-display)">基本信息</h2>
        <form id="profile-form" class="cy-form"
              th:attr="data-orig-nick=${currentUser.nickname}, data-orig-avatar=${currentUser.avatarId}">
          <div class="cy-field">
            <label>邮箱</label>
            <input class="cy-input" th:value="${currentUser.email}" disabled>
            <span class="cy-field__hint">邮箱作为登录账号不可修改。</span>
          </div>
          <div class="cy-field">
            <label for="nick">昵称</label>
            <input class="cy-input" id="nick" maxlength="20" th:value="${currentUser.nickname}">
          </div>
          <div class="cy-field">
            <label>头像</label>
            <div class="cy-avatar-picker" role="radiogroup" aria-label="选择头像">
              <button th:each="a : ${avatars}" type="button" role="radio"
                      class="cy-avatar-picker__item"
                      th:classappend="${a.id == currentUser.avatarId} ? ' is-selected' : ''"
                      th:attr="aria-checked=${a.id == currentUser.avatarId}, data-avatar-id=${a.id}"
                      th:title="${a.name}">
                <img th:src="${@fmt.avatarUrl(a.id)}" th:alt="${a.name}">
              </button>
            </div>
          </div>

          <div id="profile-msg"></div>

          <div style="display:flex;gap:var(--space-3);justify-content:flex-end">
            <button type="button" class="cy-btn cy-btn--ghost" onclick="window.location.reload()">重置</button>
            <button class="cy-btn cy-btn--primary" type="submit">保存更改</button>
          </div>
        </form>
      </div>

      <!-- 修改密码 -->
      <div class="cy-card" style="margin-bottom:var(--space-6)">
        <h2 style="font-size:var(--font-size-xl);margin:0 0 var(--space-5);font-family:var(--font-display)">修改密码</h2>
        <form id="password-form" class="cy-form">
          <div class="cy-field">
            <label for="oldPwd">当前密码</label>
            <input class="cy-input" id="oldPwd" type="password" required>
          </div>
          <div class="cy-field">
            <label for="newPwd">新密码</label>
            <input class="cy-input" id="newPwd" type="password" required minlength="8">
            <span class="cy-field__hint">至少 8 位且需含字母和数字；保存后所有 refresh token 会被吊销。</span>
          </div>
          <div class="cy-field">
            <label for="confirmPwd">确认新密码</label>
            <input class="cy-input" id="confirmPwd" type="password" required minlength="8">
          </div>

          <div id="password-msg"></div>

          <div style="display:flex;justify-content:flex-end">
            <button class="cy-btn cy-btn--primary" type="submit">更新密码</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
