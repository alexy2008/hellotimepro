<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HelloTime Pro · 把此刻寄给未来</title>
  <meta name="description" content="HelloTime Pro 2.0 UI 原型「琥珀与夜空」——写下一段话，选一个开启的时刻，把它封进胶囊。">
  <meta name="theme-color" content="#080b1a">

  <!-- 主题预注入：首帧之前定好「星夜 / 晨曦」，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ht3.theme');
        if (t) t = JSON.parse(t);
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d1650'/%3E%3Cg transform='rotate(45 32 32)'%3E%3Cpath d='M22 32V22a10 10 0 0 1 20 0v10Z' fill='%23ffb347'/%3E%3Cpath d='M22 32v10a10 10 0 0 0 20 0V32Z' fill='%23e8ecff'/%3E%3Crect x='20.6' y='30.4' width='22.8' height='3.2' rx='1.6' fill='%231b1550'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <!-- 背景：三团缓慢漂移的光晕 + 粒子画布（星夜是星星与流星，晨曦是上浮的金色微尘）+ 极淡的颗粒 -->
  <div class="bg" aria-hidden="true">

    <div class="bg__aurora bg__aurora--b"></div>
    <div class="bg__aurora bg__aurora--c"></div>
