# XcodeGen 声明：iOS SwiftUI app。提交本文件，gitignore 生成的 .xcodeproj。
# 重新生成工程：xcodegen generate
name: HelloTimePro
options:
  bundleIdPrefix: pro.hellotime
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# iOS 的 UIImage 不像 macOS NSImage 那样原生认 SVG；用 SVGView 渲染后端 SVG 头像/图标。
packages:
  SVGView:
    url: https://github.com/exyte/SVGView
    from: "1.0.6"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    HT_API_BASE: "http://127.0.0.1:9080"   # 后端地址（run 脚本可经 xcodebuild 覆盖）

targets:
  HelloTimePro:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SVGView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.hellotime.ios
        TARGETED_DEVICE_FAMILY: 1        # 1 = iPhone
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
