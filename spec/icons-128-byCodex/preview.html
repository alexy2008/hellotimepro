<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelloTime Pro Icon Comparison byCodex</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #111827;
      --muted: #64748b;
      --tile: #ffffff;
      --line: #e2e8f0;
      --shadow: 0 18px 40px rgb(15 23 42 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --tile: #111827;
        --line: #243244;
        --shadow: 0 18px 40px rgb(0 0 0 / 25%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1380px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .item {
      display: grid;
      gap: 12px;
      min-height: 202px;
      padding: 18px 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--tile);
      box-shadow: var(--shadow);
    }

    .comparison {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      width: 100%;
    }

    .variant {
      display: grid;
      place-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px 8px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--tile) 92%, var(--bg));
    }

    .variant img,
    .item > img {
      display: block;
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    .variant-label {
      width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .name {
      width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.25;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>HelloTime Pro Icon Comparison byCodex</h1>
        <p>左侧为当前 <code>spec/icons/</code> 24px 图标放大效果，右侧为 <code>spec/icons-128-byCodex/</code> 新版 128px 图标。</p>
      </div>
    </header>
    <section class="grid" aria-label="old and new icon comparison gallery">
      <figure class="item"><img src="python.svg" alt="Python"><figcaption class="name">Python</figcaption></figure>
      <figure class="item"><img src="typescript.svg" alt="TypeScript"><figcaption class="name">TypeScript</figcaption></figure>
      <figure class="item"><img src="javascript.svg" alt="JavaScript"><figcaption class="name">JavaScript</figcaption></figure>
      <figure class="item"><img src="java.svg" alt="Java"><figcaption class="name">Java</figcaption></figure>
      <figure class="item"><img src="kotlin.svg" alt="Kotlin"><figcaption class="name">Kotlin</figcaption></figure>
      <figure class="item"><img src="go.svg" alt="Go"><figcaption class="name">Go</figcaption></figure>
      <figure class="item"><img src="rust.svg" alt="Rust"><figcaption class="name">Rust</figcaption></figure>
      <figure class="item"><img src="csharp.svg" alt="C#"><figcaption class="name">C#</figcaption></figure>
      <figure class="item"><img src="swift.svg" alt="Swift"><figcaption class="name">Swift</figcaption></figure>
      <figure class="item"><img src="cpp.svg" alt="C++"><figcaption class="name">C++</figcaption></figure>
      <figure class="item"><img src="ruby.svg" alt="Ruby"><figcaption class="name">Ruby</figcaption></figure>
      <figure class="item"><img src="php.svg" alt="PHP"><figcaption class="name">PHP</figcaption></figure>
      <figure class="item"><img src="fastapi.svg" alt="FastAPI"><figcaption class="name">FastAPI</figcaption></figure>
      <figure class="item"><img src="springboot.svg" alt="Spring Boot"><figcaption class="name">Spring Boot</figcaption></figure>
      <figure class="item"><img src="gin.svg" alt="Gin"><figcaption class="name">Gin</figcaption></figure>
      <figure class="item"><img src="elysia.svg" alt="Elysia"><figcaption class="name">Elysia</figcaption></figure>
      <figure class="item"><img src="nestjs.svg" alt="NestJS"><figcaption class="name">NestJS</figcaption></figure>
      <figure class="item"><img src="aspnet.svg" alt="ASP.NET Core"><figcaption class="name">ASP.NET Core</figcaption></figure>
      <figure class="item"><img src="vapor.svg" alt="Vapor"><figcaption class="name">Vapor</figcaption></figure>
      <figure class="item"><img src="axum.svg" alt="Axum"><figcaption class="name">Axum</figcaption></figure>
      <figure class="item"><img src="drogon.svg" alt="Drogon"><figcaption class="name">Drogon</figcaption></figure>
      <figure class="item"><img src="ktor.svg" alt="Ktor"><figcaption class="name">Ktor</figcaption></figure>
      <figure class="item"><img src="react.svg" alt="React"><figcaption class="name">React</figcaption></figure>
      <figure class="item"><img src="vue.svg" alt="Vue"><figcaption class="name">Vue</figcaption></figure>
      <figure class="item"><img src="angular.svg" alt="Angular"><figcaption class="name">Angular</figcaption></figure>
      <figure class="item"><img src="svelte.svg" alt="Svelte"><figcaption class="name">Svelte</figcaption></figure>
      <figure class="item"><img src="solidjs.svg" alt="SolidJS"><figcaption class="name">SolidJS</figcaption></figure>
      <figure class="item"><img src="nextjs.svg" alt="Next.js"><figcaption class="name">Next.js</figcaption></figure>
      <figure class="item"><img src="nuxt.svg" alt="Nuxt"><figcaption class="name">Nuxt</figcaption></figure>
      <figure class="item"><img src="laravel.svg" alt="Laravel"><figcaption class="name">Laravel</figcaption></figure>
      <figure class="item"><img src="rails.svg" alt="Rails"><figcaption class="name">Rails</figcaption></figure>
      <figure class="item"><img src="nodejs.svg" alt="Node.js"><figcaption class="name">Node.js</figcaption></figure>
      <figure class="item"><img src="bun.svg" alt="Bun"><figcaption class="name">Bun</figcaption></figure>
      <figure class="item"><img src="dotnet.svg" alt=".NET"><figcaption class="name">.NET</figcaption></figure>
      <figure class="item"><img src="postgresql.svg" alt="PostgreSQL"><figcaption class="name">PostgreSQL</figcaption></figure>
      <figure class="item"><img src="sqlite.svg" alt="SQLite"><figcaption class="name">SQLite</figcaption></figure>
      <figure class="item"><img src="tailwindcss.svg" alt="Tailwind CSS"><figcaption class="name">Tailwind CSS</figcaption></figure>
      <figure class="item"><img src="hibernate.svg" alt="Hibernate"><figcaption class="name">Hibernate</figcaption></figure>
    </section>
  </main>
  <script>
    document.querySelectorAll(".item").forEach((item) => {
      const image = item.querySelector("img");
      const caption = item.querySelector(".name");
      const file = image.getAttribute("src");
      const label = image.getAttribute("alt");
      const comparison = document.createElement("div");
      comparison.className = "comparison";
      comparison.innerHTML = `
        <div class="variant">
          <img src="../icons/${file}" alt="${label} current 24px icon">
          <span class="variant-label">当前 24px 放大</span>
        </div>
        <div class="variant">
          <img src="${file}" alt="${label} byCodex 128px icon">
          <span class="variant-label">byCodex 128px</span>
        </div>
      `;
      item.replaceChildren(comparison, caption);
    });
  </script>
</body>
</html>
